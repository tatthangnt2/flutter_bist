name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # same version as development; newer Flutter deprecates package:flutter/material.dart (→ material_ui) – migrate separately
          flutter-version: 3.47.5
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get && flutter test
        working-directory: example

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # bin/ is committed: fail when someone changed tools/editor without running `npm run build`
      - run: npm run check
      # the command line still type-checks and exports the example script
      - run: node ../../bin/bist.mjs ../../example/scripts /tmp/bist-out
